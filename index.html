<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="container">
        <h1>🎯 GUESS THE NUMBER ! 🎯</h1>
        <h2 id="rangeOfNum" >Guess a Number in Between <b>1</b> and <b>100</b></h2>

        <label for="guess">YOUR GUESS: </label>
        <input id="guessBox" type="text" placeholder="Enter numbers in the Range 1 - 100">
        <button id="submitBtn">SUBMIT</button>

        <p id="result" ></p>
        <p id="numOfTries" ></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
